[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadsearch"
version = "0.1.0"
description = "Least-cost road alignment search over a DEM: hairpins, earthwork, drainage and truck operating costs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "rasterio",
    "geopandas",
    "pyarrow",
    "shapely",
    "pyproj",
    "pysheds",
    "scikit-image",
    "matplotlib",
    "mistune>=3",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
roadsearch = "roadsearch.cli:main"

[tool.setuptools]
packages = ["roadsearch"]

[tool.setuptools.package-data]
roadsearch = ["*.html", "*.md", "*.svg", "*.js", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
