# Worked examples: `python -m roadsearch example NAME` runs one, and
# `python -m roadsearch site` builds every example's viewer plus a landing page.

[haul-road]
title = "Haul Road Cost Sweep"
heading = "Where the haul road goes as truck costs rise"
description = "A 20 m mine haul road at 8% maximum grade, with lifetime truck costs weighted from k = 0 (construction only) to k = 100."
dem = "data/topo.tif"            # USGS DEM; x-y in US survey feet, z in meters
start = "2338333,1127222"
goal = "2345214,1115850"
params = "params_haul.toml"
resolution = 10
coarse_res = 15
k = [0, 0.1, 1, 10, 100]

[red-mountain]
title = "Red Mountain Road"
heading = "Red Mountain Pass: a 9 m road against US 550 as built"
description = "A 9 m road over Red Mountain Pass, construction cost only: minimum turn radii of 10, 20 and 30 m at 6% maximum grade, and 20 m at 8% and 9%, beside the as-built US 550."
dem = "data/topo_redmtn.tif"     # USGS DEM; NAD83 / UTM 13N, meters
start = "261281,4197514"
goal = "265000,4202333"
params = "params_redmtn.toml"
resolution = 5
coarse_res = 10
vary = { param = "R_min", values = [10, 20, 30], label = "Minimum turn radius", unit = "m" }
extra = [
    { label = "20 m, 8% grade", R_min = 20, g_max = 0.08 },
    { label = "20 m, 9% grade", R_min = 20, g_max = 0.09 },
]
reference = { file = "data/us550_red_mountain.geojson", label = "As built: US 550" }
