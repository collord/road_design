name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: pip install -c constraints.txt -e ".[test]"
      # Node (preinstalled on the runner) runs the browser evaluator's parity tests.
      - name: Test
        run: python -m pytest -q
