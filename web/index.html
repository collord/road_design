<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Road Search</title>
</head>
<body>
  <aside id="panel">
    <h1>Road search</h1>
    <section>
      <h2>1. Terrain</h2>
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".tif,.tiff">
        <span>Drop a GeoTIFF DEM here, or click to choose one</span>
      </label>
      <div class="row">
        <select id="example"><option value="">or an example...</option></select>
      </div>
      <p id="info" class="muted"></p>
    </section>
    <section>
      <h2>2. Start and finish</h2>
      <div class="row">
        <button id="pick-start" type="button">Click to set start</button>
        <button id="pick-goal" type="button">Click to set finish</button>
      </div>
      <div class="row">
        <label>Coordinates
          <select id="coord-crs"><option value="utm">UTM (m)</option><option value="lonlat">longitude, latitude</option></select>
        </label>
      </div>
      <label>Start <input id="start-text" placeholder="x, y"></label>
      <label>Finish <input id="goal-text" placeholder="x, y"></label>
    </section>
    <section>
      <h2>3. Area and settings</h2>
      <div class="grid2">
        <label>Margin (km) <input id="margin" type="number" min="0" step="0.5" value="10"></label>
        <label>Cell size (m) <input id="res" type="number" min="1" step="1" value="15"></label>
        <label>Max grade (%) <input id="g_max" type="number" min="1" step="0.5"></label>
        <label>Road width (m) <input id="w" type="number" min="1" step="0.5"></label>
        <label>Operating weight k <input id="k" type="number" min="0" step="0.1" value="1"></label>
        <label>Elevation units
          <select id="z_units"><option value="m">m</option><option value="ft">ft</option><option value="us_ft">US ft</option></select>
        </label>
        <label title="Contributing area that makes a channel: crossings cost a culvert from here down, and the Channels layer shows these cells">Channel threshold (ha) <input id="A_min" type="number" min="0.1" step="any"></label>
        <label title="Channels draining at least this much seed nodes of the coarse graph">Channel nodes from (ha) <input id="tin_channel_ha" type="number" min="0.1" step="any"></label>
      </div>
      <p id="estimate" class="muted"></p>
      <div class="row">
        <button id="load" type="button" disabled>Load area</button>
        <button id="run" type="button" disabled>Find corridors</button>
      </div>
    </section>
    <section>
      <h2>Layers</h2>
      <div class="grid2">
        <label>Base map
          <select id="basemap"><option value="">none</option></select>
        </label>
        <label>Hillshade <input id="hillshade" type="range" min="0" max="100" step="5" value="100"></label>
      </div>
      <div id="layers" class="layers"></div>
    </section>
    <section>
      <h2>Progress</h2>
      <ol id="log" class="log"></ol>
    </section>
    <section>
      <h2>Corridors</h2>
      <div class="table-wrap"><table id="corridors"></table></div>
    </section>
  </aside>
  <main id="map"></main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
