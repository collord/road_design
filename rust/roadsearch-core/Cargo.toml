[package]
name = "roadsearch-core"
description = "Python bindings (PyO3) for lattice-search and road-cost"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "roadsearch_core"
crate-type = ["cdylib"]

[dependencies]
lattice-search = { path = "../lattice-search" }
road-cost = { path = "../road-cost" }
terrain = { path = "../terrain" }
tin-graph = { path = "../tin-graph" }
road-fine = { path = "../road-fine" }
pyo3 = { version = "0.29", features = ["extension-module", "generate-import-lib"] }
numpy = "0.29"
