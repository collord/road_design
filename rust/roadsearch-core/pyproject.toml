[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "roadsearch-core"
description = "Fast lattice search for road alignment (Rust): Python bindings for the lattice-search and road-cost crates"
requires-python = ">=3.11"
dependencies = ["numpy"]
dynamic = ["version"]

[tool.maturin]
module-name = "roadsearch_core"
