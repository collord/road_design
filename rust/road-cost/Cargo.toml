[package]
name = "road-cost"
description = "Road edge costs on a DEM (earthwork from a section table, grade limits, culverts, fill crossings, macro tables) for lattice-search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
# Build macro tables on all cores (rayon); off for single-threaded WebAssembly.
parallel = ["dep:rayon"]

[dependencies]
lattice-search = { path = "../lattice-search" }
rayon = { version = "1", optional = true }
